
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Schedule - Login</title>
</head>

<body>

    <main>
        <h1>Welcome Back</h1>
        <p>Sign in to manage your jobs</p>

        <form>
            <label for="email">Email</label><br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label for="password">Password</label><br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <br><br>

            <button type="submit">Sign In</button>
        </form>
    </main>

</body>
</html>
