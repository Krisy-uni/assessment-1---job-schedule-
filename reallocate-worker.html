<script>
  let selectedWorker = null;

    function backToAllocateWorker() {
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get('id');

    if (!jobId) {
      window.location.href = 'allocate-worker.html';
      return;
    }

    window.location.href =
      `allocate-worker.html?id=${encodeURIComponent(jobId)}`;
  }

  function getJobId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function formatDate(dateValue) {
    if (!dateValue) return '';

    const date = new Date(`${dateValue}T00:00:00`);

    return date.toLocaleDateString('en-AU', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }

  function formatTime(timeValue) {
    if (!timeValue) return '';

    const parts = timeValue.split(':');
    const hour = Number(parts[0]);
    const minute = Number(parts[1]);

    const date = new Date();
    date.setHours(hour, minute, 0, 0);

    return date.toLocaleTimeString('en-AU', {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  function calculateHours(startTime, endTime) {
    if (!startTime || !endTime) return '';

    const startParts = startTime.split(':').map(Number);
    const endParts = endTime.split(':').map(Number);

    const startMinutes =
      startParts[0] * 60 + startParts[1];

    const endMinutes =
      endParts[0] * 60 + endParts[1];

    let durationMinutes = endMinutes - startMinutes;

    if (durationMinutes < 0) {
      durationMinutes += 24 * 60;
    }

    const hours = durationMinutes / 60;

    return Number.isInteger(hours)
      ? hours
      : hours.toFixed(1);
  }

  function getInitials(name) {
    if (!name) return '--';

    return name
      .split(' ')
      .filter(Boolean)
      .map(part => part.charAt(0))
      .join('')
      .slice(0, 2)
      .toUpperCase();
  }
  function updateWorkerOptions(currentWorker) {
    const workerOrder = [
      'Sarah Johnson',
      'Mike Lee',
      'Emma Brown',
      'James Wilson'
    ];

    const options = Array
      .from(document.querySelectorAll('[data-worker]'))
      .sort((first, second) => {
        return (
          workerOrder.indexOf(first.dataset.worker) -
          workerOrder.indexOf(second.dataset.worker)
        );
      });

    let nextRow = currentWorker ? 2 : 1;

    options.forEach(option => {
      const isCurrentWorker =
        option.dataset.worker === currentWorker;

      if (isCurrentWorker) {
        option.style.display = 'none';
        return;
      }

      option.style.display = 'grid';
      option.style.gridRow =
        `${nextRow} / ${nextRow + 1}`;

      nextRow += 1;
    });
  }
  function callClient() {
    const phoneNumber = document
      .getElementById('clientPhone')
      .textContent
      .trim()
      .replace(/[^\d+]/g, '');

    if (!phoneNumber) {
      alert('Client phone number is unavailable.');
      return;
    }

    window.location.href = `tel:${phoneNumber}`;
  }

  function selectWorker(element, workerName) {
    document
      .querySelectorAll('.button-50, .button-51, .button-52')
      .forEach(item => {
        item.style.border = '1px solid #E4D8D0';
        item.style.boxShadow = 'none';

        const circle = item.querySelector('.text-24');

        if (circle) {
          circle.innerHTML = '';
        }
      });

    element.style.border = '1px solid #E07A4F';
    element.style.boxShadow = '0 0 0 1px #E07A4F';

    const selectedCircle =
      element.querySelector('.text-24');

    if (selectedCircle) {
      selectedCircle.innerHTML =
        '<div class="selected-dot"></div>';
    }

    selectedWorker = workerName;
  }

    async function cancelWorker() {
    const jobId = getJobId();

    if (!jobId) {
      alert('Job ID is missing.');
      return;
    }

    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}`,
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            assignedWorker: null,
            status: 'Pending'
          })
        }
      );

      const updatedJob = await response.json();

      if (!response.ok) {
        throw new Error(
          updatedJob.message || 'Unable to cancel offer'
        );
      }

      document.getElementById(
        'currentWorkerRow'
      ).style.display = 'none';

            document
        .querySelectorAll('[data-worker]')
        .forEach(option => {
          option.style.border = '1px solid #E4D8D0';
          option.style.boxShadow = 'none';

          const circle = option.querySelector('.text-24');

          if (circle) {
            circle.innerHTML = '';
          }
        });

      updateWorkerOptions(null);
      selectedWorker = null;

    } catch (error) {
      console.error('Cancel worker error:', error);
      alert(error.message || 'Unable to cancel offer.');
    }
  }
  async function reassignWorker() {
    const jobId = getJobId();

    if (!jobId) {
      alert('Job ID is missing.');
      return;
    }

    if (!selectedWorker) {
      alert('Please select a worker first.');
      return;
    }

    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}`,
        {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            assignedWorker: selectedWorker,
            status: 'Pending'
          })
        }
      );

      const updatedJob = await response.json();

      if (!response.ok) {
        throw new Error(
          updatedJob.message || 'Unable to reassign worker'
        );
      }

      window.location.href =
        `job-reassign-successful.html?id=${encodeURIComponent(updatedJob._id)}`;

    } catch (error) {
      console.error('Reassign worker error:', error);
      alert(error.message || 'Unable to reassign worker.');
    }
  }

  async function loadJobDetails() {
    const jobId = getJobId();

    if (!jobId) {
      document.getElementById('jobTitle').textContent =
        'Job not found';
      return;
    }

    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}`
      );

      const job = await response.json();

      if (!response.ok) {
        throw new Error(
          job.message || 'Unable to load job'
        );
      }

      const duration = calculateHours(
        job.startTime,
        job.endTime
      );

      document.getElementById('jobNumber').textContent =
        `Job #${job._id.slice(-4).toUpperCase()}`;

      document.getElementById('jobTitle').textContent =
        job.title || 'Untitled Job';

      document.getElementById('jobStatus').textContent =
        job.status || 'Pending';

      document.getElementById('jobDate').textContent =
        `▣ ${formatDate(job.date)}`;

      document.getElementById('jobTime').textContent =
        `◷ ${formatTime(job.startTime)} – ${formatTime(job.endTime)} (${duration} hrs)`;

      document.getElementById('jobLocation').textContent =
        `⌖ ${job.location || ''}`;

      document.getElementById('jobDescription').textContent =
        job.description || 'No description provided.';

           const workerName =
        job.assignedWorker || 'No worker assigned';

      document.getElementById(
        'currentWorkerName'
      ).textContent = workerName;

      document.getElementById(
        'currentWorkerInitials'
      ).textContent = getInitials(job.assignedWorker);

      document.getElementById(
        'currentWorkerStatus'
      ).textContent = job.assignedWorker
        ? (job.status || 'Pending')
        : 'Unassigned';

      const currentWorkerRow =
        document.getElementById('currentWorkerRow');

      currentWorkerRow.style.display =
        job.assignedWorker ? '' : 'none';

           updateWorkerOptions(job.assignedWorker);

      document.getElementById('clientName').textContent =
        job.clientName || '';

      document.getElementById('clientPhone').textContent =
        job.clientPhone || '';

      document.getElementById(
        'clientInitials'
      ).textContent = getInitials(job.clientName);

    } catch (error) {
      console.error('Load job error:', error);

      document.getElementById('jobTitle').textContent =
        'Unable to load job';
    }
  }

  loadJobDetails();
</script>
